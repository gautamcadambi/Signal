<style>
  :root{
    color-scheme: light;
    --bg:#FFFFFF; --bg-2:#F6F7F8; --card:#FFFFFF; --card-2:#F1F3F4;
    --line:#E1E3E6; --line-soft:#ECEEF0;
    --tx:#1F1F23; --tx-2:#5F6368; --tx-3:#80868B;
    --brand:#EA4335; --brand-2:#C5221F; --brand-tint:rgba(234,67,53,.10);
    --sports:#E8710A; --tech:#5B5FEF; --science:#12805C; --auto:#D93A4A; --music:#B23F86;
    --glow-1:rgba(234,67,53,.05); --glow-2:rgba(91,95,239,.05);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#08080B; --bg-2:#0D0D11; --card:#111116; --card-2:#16161C;
    --line:#22222B; --line-soft:#1A1A21;
    --tx:#F2F2F5; --tx-2:#A2A2AE; --tx-3:#6C6C7A;
    --brand:#EA4335; --brand-2:#FF6B5B; --brand-tint:rgba(234,67,53,.16);
    --sports:#FF9A3C; --tech:#8B93FF; --science:#3FD9A4; --auto:#FF5F72; --music:#E879C9;
    --glow-1:rgba(234,67,53,.09); --glow-2:rgba(139,147,255,.08);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--tx);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden}
  body::before{content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(900px 500px at 12% -8%, var(--glow-2), transparent 60%),
               radial-gradient(700px 460px at 92% 4%, var(--glow-1), transparent 62%)}
  .wrap{position:relative; z-index:1; max-width:620px; margin:0 auto; padding:0 16px 110px}

  header.top{position:sticky; top:0; z-index:40; padding-top: env(safe-area-inset-top, 0px);
    background:linear-gradient(180deg, rgba(8,8,11,.97) 64%, rgba(8,8,11,0));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px)}
  .bar{max-width:620px; margin:0 auto; padding:14px 16px 10px; display:flex; align-items:center; gap:9px}
  .brand{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
  .brand h1{font-family:'Roboto',Arial,sans-serif; font-weight:900; font-size:25px; letter-spacing:-.01em; margin:0; line-height:1; color:var(--tx)}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--science);box-shadow:0 0 12px var(--science);flex:none}
  .brand .dot.live{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stamp{font-family:'JetBrains Mono',ui-monospace,monospace; font-size:10px; color:var(--tx-3); letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
  .tabs{display:flex; gap:3px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px}
  .tab{appearance:none; border:0; background:transparent; color:var(--tx-2); cursor:pointer; font:inherit;
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px;
    display:flex; align-items:center; gap:5px; transition:.18s; white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--brand); color:#FFFFFF}
  .tab .n{font-family:'JetBrains Mono',monospace; font-size:10px; opacity:.72}
  .gear{appearance:none; border:1px solid var(--line); background:var(--card); color:var(--tx-2);
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer; flex:none; transition:.18s}
  .gear:hover{color:var(--tx); border-color:#32323E}
  .gear[aria-selected="true"]{background:var(--brand); color:#FFFFFF; border-color:var(--brand)}
  .gear svg{width:16px;height:16px}

  .chips{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 12px; max-width:620px; margin:0 auto; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips[hidden]{display:none}
  .chip{appearance:none; cursor:pointer; white-space:nowrap; font:inherit; font-size:12.5px; font-weight:500;
    padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--tx-2);
    display:flex; align-items:center; gap:7px; transition:.18s}
  .chip:hover{border-color:#2F2F3B; color:var(--tx)}
  .chip .sw{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .chip[aria-pressed="true"]{color:var(--tx); border-color:color-mix(in srgb, var(--c) 55%, transparent); background:color-mix(in srgb, var(--c) 13%, var(--card))}
  .chip[aria-pressed="true"] .sw{background:var(--c); box-shadow:0 0 9px var(--c)}

  .day{display:flex; align-items:center; gap:12px; margin:26px 2px 14px}
  .day h2{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--tx-2); margin:0; white-space:nowrap}
  .day .rule{height:1px; background:linear-gradient(90deg,var(--line),transparent); flex:1}
  .day .cnt{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--tx-3)}

  .card{background:var(--card); border:1px solid var(--line-soft); border-radius:22px; overflow:hidden; margin-bottom:16px; position:relative; transition:border-color .2s}
  .card:hover{border-color:var(--line)}
  .card.saved{border-color:color-mix(in srgb, var(--c) 42%, var(--line-soft))}

  .cover{position:relative; aspect-ratio:16/9; overflow:hidden; cursor:pointer; background:#0C0C10}
  .cover svg.bg{position:absolute; inset:0; width:100%; height:100%; display:block}
  .cover img.ph{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .35s}
  .cover img.ph.on{opacity:1}
  .cover .veil{position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,8,11,.05) 0%, rgba(8,8,11,.42) 58%, rgba(8,8,11,.88) 100%)}
  .cover.photo .veil{background:linear-gradient(180deg, rgba(8,8,11,.18) 0%, rgba(8,8,11,.5) 55%, rgba(8,8,11,.92) 100%)}
  .cover .meta{position:absolute; top:14px; left:15px; right:15px; display:flex; align-items:center; gap:8px; z-index:2}
  .src{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; padding:5px 10px 5px 8px; border-radius:999px; background:rgba(8,8,11,.62); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(8px); color:var(--tx); max-width:62%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .src .sw{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
  .kind{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--c); padding:4px 9px; border-radius:6px; background:color-mix(in srgb, var(--c) 16%, rgba(8,8,11,.58)); border:1px solid color-mix(in srgb, var(--c) 32%, transparent); white-space:nowrap}
  .hero{position:absolute; left:16px; right:16px; bottom:13px; z-index:2}
  .hero .big{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:clamp(28px,7.8vw,40px); line-height:.96; letter-spacing:-.02em; text-shadow:0 3px 26px rgba(0,0,0,.72)}
  .hero .big em{font-style:normal; color:var(--c)}
  .hero .lab{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-2); margin-top:6px; text-shadow:0 2px 12px rgba(0,0,0,.7)}

  .body{padding:15px 17px 14px}
  .title{font-size:17.5px; font-weight:650; line-height:1.32; letter-spacing:-.012em; margin:0 0 7px}
  .dek{color:var(--tx-2); font-size:14px; margin:0}
  .dek q{quotes:'"' '"'; font-style:italic; color:var(--tx)}

  .facts{display:flex; flex-wrap:wrap; gap:7px; margin-top:13px}
  .fact{font-size:11.5px; color:var(--tx-2); background:var(--card-2); border:1px solid var(--line-soft); padding:5px 10px; border-radius:9px; display:flex; align-items:center; gap:6px}
  .fact b{color:var(--tx); font-weight:600}
  .fact .k{color:var(--tx-3); font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase}

  .more{max-height:0; overflow:hidden; transition:max-height .32s cubic-bezier(.4,0,.2,1)}
  .more .inner{padding-top:13px; margin-top:13px; border-top:1px solid var(--line-soft); color:var(--tx-2); font-size:14px}
  .more .inner p{margin:0}

  .foot{display:flex; align-items:center; gap:8px; margin-top:13px}
  .time{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--tx-3); letter-spacing:.04em; margin-right:auto; display:flex; align-items:center; gap:7px}
  .pen{color:var(--c); font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:700}
  .btn{appearance:none; cursor:pointer; font:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--card-2); color:var(--tx-2); padding:7px 12px; border-radius:10px; display:inline-flex; align-items:center; gap:6px; transition:.16s; text-decoration:none}
  .btn:hover{color:var(--tx); border-color:#30303C}
  .btn svg{width:13px;height:13px;flex:none}
  .btn.save[aria-pressed="true"]{color:var(--c); border-color:color-mix(in srgb,var(--c) 45%,transparent); background:color-mix(in srgb,var(--c) 14%,var(--card-2))}
  .btn.save[aria-pressed="true"] svg{fill:var(--c); stroke:var(--c)}
  .btn.primary{background:var(--brand); color:#FFFFFF; border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2); color:#FFFFFF}

  .theme-toggle{
    appearance:none; border:1px solid var(--line); background:var(--card); color:var(--tx-2);
    width:34px; height:34px; border-radius:50%; display:grid; place-items:center; cursor:pointer; flex:none; transition:.18s;
  }
  .theme-toggle:hover{color:var(--tx); border-color:#8886}
  .theme-toggle svg{width:16px;height:16px}
  .theme-toggle .sun{display:none}
  [data-theme="dark"] .theme-toggle .moon{display:none}
  [data-theme="dark"] .theme-toggle .sun{display:block}

  .arch{font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--tx-3); border:1px dashed var(--line); padding:4px 9px; border-radius:7px; margin-right:auto}

  .mcard{display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line-soft); border-radius:18px; padding:12px; margin-bottom:11px; transition:border-color .2s}
  .mcard:hover{border-color:var(--line)}
  .mart{width:82px; height:82px; border-radius:13px; overflow:hidden; flex:none; position:relative; background:#0C0C10}
  .mart svg{width:100%; height:100%; display:block}
  .minfo{min-width:0; flex:1}

  /* keyword → illustration, for live items with no photo */

  /* ---------------- background texture + cover ---------------- */
  function seeded(n){ let s=n; return () => (s=(s*1664525+1013904223)%4294967296)/4294967296; }
  function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); }

  function texture(motif, c, r){
    let s = "";
    if(motif === "grid"){
      for(let x=0;x<=24;x++) s += `<line x1="${x*40}" y1="0" x2="${x*40}" y2="420" stroke="${c}" stroke-opacity="${0.03+r()*0.05}" stroke-width="1"/>`;
      for(let y=0;y<=11;y++) s += `<line x1="0" y1="${y*40}" x2="960" y2="${y*40}" stroke="${c}" stroke-opacity="${0.03+r()*0.04}" stroke-width="1"/>`;
    } else if(motif === "arcs"){
      const cx = 180+r()*140;
      for(let i=1;i<=9;i++) s += `<circle cx="${cx}" cy="420" r="${i*64}" fill="none" stroke="${c}" stroke-opacity="${0.16-i*0.014}" stroke-width="1.4"/>`;
    } else if(motif === "orbit"){
      for(let i=0;i<50;i++) s += `<circle cx="${r()*960}" cy="${r()*420}" r="${r()*1.7}" fill="#fff" opacity="${.10+r()*.35}"/>`;
      for(let i=0;i<3;i++) s += `<ellipse cx="300" cy="210" rx="${220+i*160}" ry="${70+i*44}" fill="none" stroke="${c}" stroke-opacity="${0.16-i*0.04}" stroke-width="1.4" transform="rotate(${-22+i*16} 300 210)"/>`;
    } else {
      for(let i=0;i<16;i++) s += `<rect x="${r()*420}" y="${r()*420}" width="${120+r()*500}" height="${1.4+r()*3}" rx="2" fill="${c}" opacity="${.05+r()*.16}"/>`;
    }
    return s;
  }

  function cover(p){

  /* ---------------- storage ---------------- */
  const K = { saved:"signal.saved.v2", pos:"signal.pos.v2", art:"signal.artists.v1",
              cache:"signal.cache.v1", feeds:"signal.feeds.v1", inst:"signal.install.v1",

  async function initDb(){

  /* ---------------- live feeds ---------------- */
  function textOf(node, names){
    if(!node) return "";
    for(const kid of node.children) if(names.includes(kid.localName)) return (kid.textContent || "").trim();
    return "";
  }
  function attrOf(node, name, attr){
    if(!node) return "";
    for(const kid of node.children) if(kid.localName === name){ const v = kid.getAttribute(attr); if(v) return v; }
    return "";
  }
  function stripHtml(s){
    const d = document.createElement("div");
    d.innerHTML = s || "";
    return (d.textContent || "").replace(/\s+/g, " ").trim();
  }
  function imgFrom(node, raw){
    let u = attrOf(node, "thumbnail", "url") || "";
    if(!u) for(const kid of node.children){
      if(kid.localName === "content" && (kid.getAttribute("medium") === "image" || /image/.test(kid.getAttribute("type") || ""))){
        u = kid.getAttribute("url") || ""; if(u) break;
      }
      if(kid.localName === "enclosure" && /image/.test(kid.getAttribute("type") || "")){
        u = kid.getAttribute("url") || ""; if(u) break;
      }
      if(kid.localName === "group"){ const t = attrOf(kid, "thumbnail", "url") || attrOf(kid, "content", "url"); if(t){ u = t; break; } }
    }
    if(!u){ const m = /<img[^>]+src=["']([^"']+)["']/i.exec(raw || ""); if(m) u = m[1]; }
    if(u && u.startsWith("http://")) u = "https://" + u.slice(7);
    return u;
  }

  const NUM_RE = /(?:^|[\s(])([$₹€£]?\d[\d,.]*(?:[-\s]?(?:%|W|nm|mph|km\/h|hp|bhp|GB|TB|MP|mAh|kWh|mi|km|K))?)(?=[\s.,;:)?!\-–—]|$)/;
  function heroNumber(title){
    const m = NUM_RE.exec(title);
    if(!m) return null;
    const v = m[1].trim();
    if(/^(19|20)\d{2}$/.test(v)) return null;     // a bare year is not a headline stat
    if(v.length > 12) return null;
    return v;
  }

  const STOP = new Set(("the a an and or of to in on for with at by from is are was were be been it its this that as into over after "
    + "new first next last more most than then out up off about against during how why what when who will would can could may might").split(" "));
  function tokens(s){
    return new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/)
      .filter(w => w.length > 2 && !STOP.has(w))
      .map(w => (w.length > 3 && w.endsWith("s")) ? w.slice(0,-1) : w));
  }
  function sameStory(a, b, hours){
    if(a.cat !== b.cat) return false;
    if(Math.abs(new Date(a.ts) - new Date(b.ts)) > (hours || 36) * 3600000) return false;
    const A = tokens(a.title), B = tokens(b.title);
    if(!A.size || !B.size) return false;
    let inter = 0;
    for(const w of A) if(B.has(w)) inter++;
    return inter >= 3 && inter / Math.min(A.size, B.size) >= 0.6;
  }

  function parseChannel(xml, ch){
    let doc;
    try{ doc = new DOMParser().parseFromString(xml, "application/xml"); }catch(e){ return null; }
    if(!doc || doc.getElementsByTagName("parsererror").length) return null;
    const root = doc.documentElement;
    let name = ch.label;
    for(const kid of root.children) if(kid.localName === "title"){ name = (kid.textContent||"").trim() || name; break; }
    const out = [];
    for(const n of doc.getElementsByTagName("entry")){
      const title = textOf(n, ["title"]);
      const link = attrOf(n, "link", "href") || textOf(n, ["link"]);
      const when = textOf(n, ["published","updated"]);
      const t = when ? Date.parse(when) : NaN;
      if(!title || isNaN(t)) continue;
      let img = "";
      for(const kid of n.children) if(kid.localName === "group"){ img = attrOf(kid, "thumbnail", "url"); break; }
      out.push({ id:"yt:" + hash(link || title).toString(36), artist:name, title,
                 type:"YouTube", date:new Date(t).toISOString(), url:link || "#", img, live:true });
    }
    return { name, items: out.slice(0, 6) };
  }

  function parseFeed(xml, feed){
    let doc;
    try{ doc = new DOMParser().parseFromString(xml, "application/xml"); }catch(e){ return []; }
    if(!doc || doc.getElementsByTagName("parsererror").length) return [];
    const nodes = [...doc.getElementsByTagName("item"), ...doc.getElementsByTagName("entry")];
    const out = [];
    for(const n of nodes){
      const title = textOf(n, ["title"]);
      if(!title) continue;
      let link = textOf(n, ["link"]);
      if(!link) link = attrOf(n, "link", "href");
      const dateStr = textOf(n, ["pubDate","published","updated","date"]);
      const t = dateStr ? Date.parse(dateStr) : NaN;
      if(isNaN(t)) continue;
      const rawSum = textOf(n, ["description","summary","encoded","content"]);
      const dek = stripHtml(rawSum).slice(0, 210);
      const num = heroNumber(title);
      out.push({
        id: "live:" + hash(link || title).toString(36),
        ts: new Date(t).toISOString(),
        cat: feed.cat, kind: "Latest", source: feed.label,
        title, dek: dek || "", detail: "", facts: [],
        url: link || "#", img: imgFrom(n, rawSum),
        art: pickArt(title, feed.cat), motif: MOTIF[feed.cat] || "grid",
        hero: num ? { big: num, lab: feed.label } : null,
        live: true
      });
    }
    return out;
  }

  async function grab(url){
    const errs = [];
    for(const relay of relayList()){
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 11000);
      try{
        const res = await fetch(relay.build(url), { signal: ctl.signal, cache: "no-store" });
        clearTimeout(timer);
        if(!res.ok){ errs.push(relay.name + " " + res.status); continue; }
        let txt = await res.text();
        if(relay.json){
          try{ txt = JSON.parse(txt).contents || ""; }
          catch(e){ errs.push(relay.name + " badjson"); continue; }
        }
        txt = (txt || "").replace(/^\uFEFF/, "").trim();
        if(txt.length < 150){ errs.push(relay.name + " empty"); continue; }
        if(txt[0] !== "<"){ errs.push(relay.name + " not-xml"); continue; }
        bestRelay = relay.name;
        return { txt, via: relay.name, errs };
      }catch(e){
        clearTimeout(timer);
        errs.push(relay.name + " " + (e && e.name === "AbortError" ? "timeout" : "blocked"));
      }
    }
    return { txt: null, via: null, errs };
  }

  async function refresh(manual){
    if(!LIVE_ENABLED || fetching) return;
    fetching = true;
    document.getElementById("dot").classList.add("live");
    const on = feeds.filter(f => f.on !== false);
    on.forEach(f => { if(!status[f.id] || status[f.id].state !== "ok") status[f.id] = { state:"wait" }; });
    if(tab === "sources") render(true);

    const one = async f => {
      const got = await grab(f.url);
      if(!got.txt){ status[f.id] = { state:"err", why: got.errs.slice(0,3).join(", ") || "no relay answered" }; return []; }
      const items = parseFeed(got.txt, f);
      status[f.id] = items.length
        ? { state:"ok", n:items.length, via:got.via }
        : { state:"err", why:"reached via " + got.via + " but no items parsed" };
      return items;
    };
    // four at a time: free relays rate-limit if you hit them with everything at once
    const results = [];
    for(let i = 0; i < on.length; i += 4){
      results.push(...await Promise.all(on.slice(i, i + 4).map(one)));
      if(tab === "sources") render(true);
    }

    const cut = Date.now() - WINDOW_DAYS * 86400000;
    const merged = [];
    for(const item of results.flat().sort((a,b) => new Date(b.ts) - new Date(a.ts))){
      if(new Date(item.ts).getTime() < cut) continue;
      if(merged.some(m => sameStory(m, item))) continue;
      merged.push(item);
      if(merged.length >= MAX_AUTO) break;
    }
    if(merged.length){
      liveItems = merged;
      fetchedAt = new Date().toISOString();
      ls.set(K.cache, { items: liveItems, at: fetchedAt });
    }

    // artist channels
    const chOn = channels.filter(c => c.on !== false);
    if(chOn.length){
      const rel = [];
      for(let i = 0; i < chOn.length; i += 4){
        const batch = await Promise.all(chOn.slice(i, i + 4).map(async c => {
          const got = await grab(c.url);
          if(!got.txt){ status[c.id] = { state:"err", why: got.errs.slice(0,2).join(", ") || "no relay answered" }; return []; }
          const parsed = parseChannel(got.txt, c);
          if(!parsed){ status[c.id] = { state:"err", why:"not a channel feed" }; return []; }
          if(parsed.name && parsed.name !== c.label){ c.label = parsed.name; ls.set(K.chan, channels); }
          status[c.id] = { state:"ok", n:parsed.items.length, via:got.via };
          return parsed.items;
        }));
        rel.push(...batch.flat());
      }
      if(rel.length){
        releases = rel.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 40);
        ls.set(K.mcache, releases);
      }
    }
    fetching = false;
    document.getElementById("dot").classList.remove("live");
    render(true);
    if(manual) toast(merged.length ? `Updated — ${merged.length} stories` : "No sources answered");
  }

  /* ---------------- google / youtube account ---------------- */

  /* ---------------- diagnostics ---------------- */
  let diag = null;
  async function runDiagnostics(){
    diag = { running:true, lines:["Running checks…"] };
    render(true);
    const lines = [];

    // 1. is the function layer alive?
    try{
      const r = await fetch("/.netlify/functions/ping", { cache:"no-store" });
      if(r.ok){
        const j = await r.json();
        lines.push(`own server      OK  (node ${j.node})`);
        lines.push(`google oauth    ${j.oauth ? "keys present" : "keys NOT set"}`);
      } else {
        lines.push(`own server      HTTP ${r.status}  <- functions did not deploy`);
      }
    }catch(e){ lines.push(`own server      unreachable  <- functions did not deploy`); }

    // 2. test every relay against one real feed
    const probe = "https://www.sciencedaily.com/rss/all.xml";
    for(const relay of relayList()){
      if(relay.name === "own server") continue;
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 11000);
      const t0 = Date.now();
      try{
        const res = await fetch(relay.build(probe), { signal:ctl.signal, cache:"no-store" });
        clearTimeout(timer);
        let txt = await res.text();
        if(relay.json){ try{ txt = JSON.parse(txt).contents || ""; }catch(e){ txt = ""; } }
        const ms = Date.now() - t0;
        if(!res.ok) lines.push(pad(relay.name) + `HTTP ${res.status}  (${ms}ms)`);
        else if(!txt || txt.trim()[0] !== "<") lines.push(pad(relay.name) + `answered but not a feed (${ms}ms)`);
        else lines.push(pad(relay.name) + `OK  ${txt.length} bytes  (${ms}ms)`);
      }catch(e){
        clearTimeout(timer);
        lines.push(pad(relay.name) + (e && e.name === "AbortError" ? "timeout" : "blocked by network"));
      }
    }
    lines.push("");
    lines.push("service worker  " + (navigator.serviceWorker && navigator.serviceWorker.controller ? "active" : "not active"));
    lines.push("origin          " + location.origin);
    diag = { running:false, lines };
    render(true);
  }
  function pad(s){ return (s + "                ").slice(0, 16); }

  /* ---------------- state ---------------- */
  let tab = "feed", filter = "all", shown = BATCH, io = null, restoring = false;
  const expanded = new Set();

  const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dayKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const snapDays = d => Math.floor(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()/86400000);
  function dayLabel(d){
    const diff = snapDays(new Date()) - snapDays(d);
    if(diff === 0) return "Today";
    if(diff === 1) return "Yesterday";
    return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  }
  function clock(d){ let h=d.getHours(), m=String(d.getMinutes()).padStart(2,"0"); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${m} ${ap}`; }
  function ago(iso){
    if(!iso) return "never";
    const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
    if(s < 90) return "just now";
    if(s < 5400) return Math.round(s/60) + "m ago";
    if(s < 172800) return Math.round(s/3600) + "h ago";
    return Math.round(s/86400) + "d ago";
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

  const ICON = {
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>',
    check:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>',
    ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>'
  };

  const app = document.getElementById("app");

  /* install prompt */

  function render(keepScroll){

    const list = currentList();
    if(!list.length){
      app.innerHTML = `<div class="empty"><h3>${tab==="saved"?"Nothing saved yet":"Nothing in this section"}</h3>
        <p>${tab==="saved"?"Tap the bookmark on any post to keep it past today.":"Try another filter."}</p></div>`;
      return;
    }

    let html = (tab === "feed" ? installCard() : ""), last = null;
    list.slice(0, shown).forEach(p => {
      const d = new Date(p.ts), k = dayKey(d);
      if(k !== last){
        last = k;
        const n = list.filter(q => dayKey(new Date(q.ts)) === k).length;
        html += `<div class="day"><h2>${dayLabel(d)}</h2><span class="rule"></span><span class="cnt">${n} ${n===1?"story":"stories"}</span></div>`;
      }
      html += card(p);
    });

    if(shown < list.length){
      html += `<div class="loader" id="sentinel"><span></span><span></span><span></span></div>`;
    } else {
      html += `<div class="end"><div class="mark">${ICON.check}</div>
        <h3>${tab==="saved" ? "End of your saved posts." : "That's the whole feed."}</h3>
        <p>${tab==="saved" ? "These stay put. Nothing here expires."
          : "Everything your sources published, oldest to newest. Nothing more loads — older stories drop off tomorrow, and anything you saved stays."}</p>
        <div class="tally">${list.length} stories · ${savedMap.size} saved</div></div>`;
    }
    app.innerHTML = html;
    loadPhotos();
    if(keepScroll) window.scrollTo(0,y);
    watchSentinel();
  }

  function loadPhotos(){
    app.querySelectorAll("img.ph[data-src]").forEach(img => {
      const src = img.dataset.src;
      img.removeAttribute("data-src");
      img.addEventListener("load", () => img.classList.add("on"));
      img.addEventListener("error", () => img.remove());   // fall back to the illustration
      img.src = src;
    });
  }

  function watchSentinel(){
    if(io) io.disconnect();
    const s = document.getElementById("sentinel");
    if(!s) return;
    io = new IntersectionObserver(entries => {
      if(entries.some(e => e.isIntersecting)){
        io.disconnect();
        setTimeout(() => { shown += BATCH; render(true); }, 240);
      }
    }, { rootMargin:"400px 0px" });
    io.observe(s);
  }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1900);
  }

  /* ---------------- position memory ---------------- */
  function trackPosition(){
    if(restoring || tab !== "feed") return;
    const cards = [...document.querySelectorAll(".card")];
    const top = (window.scrollY || 0) + 140;
    let cur = null;
    for(const el of cards){ if(el.offsetTop <= top) cur = el; else break; }
    if(cur) ls.set(K.pos, { id:cur.dataset.id, off:Math.round(window.scrollY - cur.offsetTop), shown, filter });
  }
  let tTimer;
  window.addEventListener("scroll", () => { clearTimeout(tTimer); tTimer = setTimeout(trackPosition, 220); }, { passive:true });
  window.addEventListener("beforeunload", trackPosition);

  function restore(){
    const pos = ls.get(K.pos, null);
    if(!pos || !pos.id) return;
    if(pos.filter && pos.filter !== "all") filter = pos.filter;
    const list = currentList();
    const idx = list.findIndex(p => p.id === pos.id);
    if(idx < 0) return;
    shown = Math.max(shown, Math.min(list.length, Math.ceil((idx + 2) / BATCH) * BATCH), pos.shown || 0);
    restoring = true;
    render();
    requestAnimationFrame(() => {
      const el = app.querySelector(`.card[data-id="${CSS.escape(pos.id)}"]`);
      if(el){
        window.scrollTo({ top: Math.max(0, el.offsetTop + (pos.off || 0)) });
        if(idx > 0){
          const r = document.getElementById("resume");
          r.classList.add("on"); setTimeout(() => r.classList.remove("on"), 2400);
        }
      }
      restoring = false;
    });
  }

  /* ---------------- events ---------------- */
  app.addEventListener("click", async e => {
    if(e.target.id === "instNo" || e.target.id === "instX"){ instDone = true; ls.set(K.inst, true); render(true); return; }
    if(e.target.id === "instGo" && deferredPrompt){
      const p = deferredPrompt; deferredPrompt = null; p.prompt();
      p.userChoice.finally(() => { instDone = true; ls.set(K.inst, true); render(true); });
      return;
    }
    if(e.target.id === "doRefresh"){ refresh(true); return; }
    if(e.target.id === "doDiag"){ runDiagnostics(); return; }
    if(e.target.id === "rSave"){
      const i = document.getElementById("rUrl");
      customRelay = i ? i.value.trim() : "";
      ls.set(K.relay, customRelay); bestRelay = null;
      toast(customRelay ? "Custom relay saved" : "Custom relay cleared");
      render(true); refresh(true); return;
    }
    if(e.target.id === "resetFeeds"){ feeds = DEFAULT_FEEDS.map(f => ({ ...f, on:true })); ls.set(K.feeds, feeds); render(true); refresh(true); return; }
    if(e.target.id === "fAdd"){ addFeed(); return; }
    if(e.target.id === "cAdd"){ addChannel(); return; }
    if(e.target.id === "spRefresh"){ spCheck().then(() => render(true)); return; }
    if(e.target.id === "spOut"){ spDisconnect(); return; }
    const ctog = e.target.closest("[data-ctog]");
    if(ctog){ const i = +ctog.dataset.ctog; channels[i].on = channels[i].on === false; ls.set(K.chan, channels); render(true); return; }
    const cdel = e.target.closest("[data-cdel]");
    if(cdel){ channels.splice(+cdel.dataset.cdel, 1); ls.set(K.chan, channels); render(true); return; }
    if(e.target.id === "aAdd"){ addArtist(); return; }

    const tog = e.target.closest("[data-tog]");
    if(tog){ const i = +tog.dataset.tog; feeds[i].on = feeds[i].on === false; ls.set(K.feeds, feeds); render(true); return; }
    const del = e.target.closest("[data-del]");
    if(del){ feeds.splice(+del.dataset.del, 1); ls.set(K.feeds, feeds); render(true); return; }
    const rm = e.target.closest("[data-rm]");
    if(rm){ artists = artists.filter(a => a !== rm.dataset.rm); pushArtists(); render(true); return; }

    const el = e.target.closest("[data-act]"); if(!el) return;
    const art = el.closest(".card"); if(!art) return;
    const id = art.dataset.id;

    if(el.dataset.act === "save"){
      if(savedMap.has(id)){ savedMap.delete(id); toast("Removed from saved"); }
      else {
        const p = allPosts().find(x => x.id === id) || savedMap.get(id);
        if(p){ savedMap.set(id, { ...p, edition:EDITION, savedAt:new Date().toISOString() }); toast("Saved — this one won't expire"); }
      }
      pushSaved(); render(true); return;
    }
    if(el.dataset.act === "open"){
      const p = allPosts().find(x => x.id === id);
      if(p && p.url && p.url !== "#") window.open(p.url, "_blank", "noopener");
      return;
    }
    if(el.dataset.act === "toggle"){
      const box = art.querySelector("[data-more]");
      const btn = art.querySelector('.btn[data-act="toggle"]');
      if(!box) return;
      if(expanded.has(id)){ expanded.delete(id); box.style.maxHeight = "0"; if(btn) btn.innerHTML = "More " + ICON.chev; }
      else { expanded.add(id); box.style.maxHeight = box.scrollHeight + 48 + "px"; if(btn) btn.innerHTML = "Less " + ICON.chev; }
    }
  });

  app.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    if(e.target.id === "aInput") addArtist();
    if(e.target.id === "fUrl") addFeed();
    if(e.target.id === "cInput") addChannel();
  });

  function addArtist(){
    const i = document.getElementById("aInput"); if(!i) return;
    const v = i.value.trim().replace(/\s+/g," ");
    if(!v) return;
    if(!artists.some(a => a.toLowerCase() === v.toLowerCase())) artists.push(v);
    i.value = ""; pushArtists(); render(true);
    const n = document.getElementById("aInput"); if(n) n.focus();
    toast("Added — I'll check them on the next curated refresh");
  }

  async function addChannel(){
    const i = document.getElementById("cInput");
    if(!i) return;
    let v = i.value.trim();
    if(!v) return;
    i.value = "";
    let page = v;
    if(/^@/.test(v)) page = "https://www.youtube.com/" + v;
    else if(!/^https?:/i.test(v)) page = "https://www.youtube.com/@" + v.replace(/\s+/g,"");
    let feedUrl = null, label = v.replace(/^@/,"");

    const direct = /channel_id=(UC[\w-]{22})/.exec(page) || /\/channel\/(UC[\w-]{22})/.exec(page);
    if(direct){
      feedUrl = "https://www.youtube.com/feeds/videos.xml?channel_id=" + direct[1];
    } else {
      toast("Looking up that channel…");
      const got = await grab(page);
      const m = got.txt && /"(?:channelId|externalId)"\s*:\s*"(UC[\w-]{22})"/.exec(got.txt);
      if(!m){ toast("Couldn't find that channel — try the full youtube.com link"); return; }
      feedUrl = "https://www.youtube.com/feeds/videos.xml?channel_id=" + m[1];
    }
    if(channels.some(c => c.url === feedUrl)){ toast("Already added"); return; }
    channels.push({ id:"ch:" + hash(feedUrl).toString(36), label, url:feedUrl, on:true });
    ls.set(K.chan, channels);
    render(true);
    refresh(true);
  }

  async function addFeed(){
    const i = document.getElementById("fUrl"), c = document.getElementById("fCat");
    if(!i) return;
    let url = i.value.trim();
    if(!url) return;
    const cat = c ? c.value : "tech";
    i.value = "";

    if(/youtube\.com|youtu\.be/i.test(url) && !/feeds\/videos\.xml/i.test(url)){
      toast("Looking up that channel…");
      const html = await grab(url);
      const m = html && /"(?:channelId|externalId)"\s*:\s*"(UC[\w-]{22})"/.exec(html);
      if(!m){ toast("Couldn't find that channel's ID"); return; }
      url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + m[1];
    }

    let label = "";
    try{ label = new URL(url).hostname.replace(/^www\./,""); }catch(e){ toast("That doesn't look like a URL"); return; }
    const id = "custom:" + hash(url).toString(36);
    if(feeds.some(f => f.url === url)){ toast("Already in the list"); return; }
    feeds.push({ id, cat, label, url, on:true });
    ls.set(K.feeds, feeds);
    render(true);
    refresh(true);
  }

  chipsEl.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    filter = b.dataset.f; shown = BATCH; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    trackPosition(); tab = t.dataset.tab; shown = BATCH; render(); window.scrollTo({top:0,behavior:"smooth"});
  }));
  document.getElementById("gear").addEventListener("click", () => {
    trackPosition(); tab = tab === "sources" ? "feed" : "sources"; shown = BATCH; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
  document.addEventListener("visibilitychange", () => {
    if(!document.hidden && fetchedAt && Date.now() - new Date(fetchedAt).getTime() > 1800000) refresh(false);
  });

  /* ---------------- theme ---------------- */
  function applyTheme(mode){
    document.documentElement.dataset.theme = mode;
    ls.set(K.theme, mode);
  }
  document.getElementById("themeToggle").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
  });

  /* ---------------- boot ---------------- */
  applyTheme(ls.get(K.theme, "light"));
  loadLocal();
  render();
  restore();
  initDb();
  refresh(false);

  if(LIVE_ENABLED){
    const q = new URLSearchParams(location.search).get("sp");
    if(q){
      history.replaceState(null, "", location.pathname);
      if(q === "ok") tab = "music";
      else toast("Spotify sign-in failed: " + q);
    }
    spCheck().then(() => { if(sp.connected || tab === "music") render(true); });
  }
  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

})();
</script>
</body>
</html>
